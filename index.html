<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إدارة الطلاب</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .form-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .buttons { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; flex: 1; font-size: 14px; transition: 0.3s; }
        .btn-add { background-color: #28a745; }
        .btn-add:hover { background-color: #218838; }
        .btn-edit { background-color: #ffc107; color: #000; }
        .btn-edit:hover { background-color: #e0a800; }
        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>نظام إدارة الطلاب</h2>
        <div class="form-group">
            <label for="studentId">رقم الطالب (ID):</label>
            <input type="text" id="studentId" placeholder="مطلوب في التعديل والحذف">
        </div>
        <div class="form-group">
            <label for="studentName">اسم الطالب:</label>
            <input type="text" id="studentName" placeholder="أدخل اسم الطالب">
        </div>
        <div class="form-group">
            <label for="studentStage">المرحلة الدراسية:</label>
            <select id="studentStage">
                <option value="primary">المرحلة الابتدائية</option>
                <option value="middle">المرحلة المتوسطة</option>
                <option value="high">المرحلة الثانوية</option>
            </select>
        </div>
        <div class="buttons">
            <button class="btn-add" onclick="sendData('add')">إضافة</button>
            <button class="btn-edit" onclick="sendData('edit')">تعديل</button>
            <button class="btn-delete" onclick="sendData('delete')">حذف</button>
        </div>
    </div>

    <script>
        // استبدل هذا الرابط برابط Webhook الخاص بك من n8n
        const N8N_WEBHOOK_URL = 'https://YOUR_N8N_DOMAIN/webhook/student-manager';

        async function sendData(action) {
            const id = document.getElementById('studentId').value;
            const name = document.getElementById('studentName').value;
            const stage = document.getElementById('studentStage').value;

            // التحقق من وجود الـ ID في حالتي التعديل والحذف
            if ((action === 'edit' || action === 'delete') && !id) {
                alert('يرجى إدخال رقم الطالب (ID) لإتمام هذه العملية.');
                return;
            }

            // تجهيز البيانات لإرسالها
            const payload = {
                action: action, // 'add' | 'edit' | 'delete'
                id: id,
                name: name,
                stage: stage // 'primary' | 'middle' | 'high'
            };

            try {
                // إرسال البيانات إلى n8n
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('تم إرسال الطلب بنجاح!');
                    // تفريغ الحقول بعد الإرسال
                    document.getElementById('studentId').value = '';
                    document.getElementById('studentName').value = '';
                } else {
                    alert('حدث خطأ أثناء الاتصال بالخادم.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('فشل الاتصال. تأكد من عمل سيرفر n8n.');
            }
        }
    </script>
</body>
</html>
