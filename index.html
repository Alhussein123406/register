<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة بيانات الطلاب</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 550px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: opacity 0.3s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-add { background-color: var(--success-color); }
        .btn-update { background-color: var(--warning-color); }
        .btn-delete { background-color: var(--danger-color); }

        button:hover {
            opacity: 0.9;
        }

        #response-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة بيانات الطلاب</h2>
    <form id="studentForm">
        
        <!-- رقم الهوية (مفتاح البحث وجلب البيانات) -->
        <div class="form-group">
            <label for="nationalId">رقم الهوية:</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="nationalId" name="nationalId" required placeholder="أدخل رقم الهوية للبحث أو الإضافة">
                <button type="button" id="btnFetch" style="flex: 0 0 100px; background-color: var(--primary-color);">بحث</button>
            </div>
        </div>

        <!-- اسم الطالب -->
        <div class="form-group">
            <label for="studentName">اسم الطالب:</label>
            <input type="text" id="studentName" name="studentName" required placeholder="أدخل اسم الطالب الكامل">
        </div>

        <!-- القسم (بنين أم بنات) -->
        <div class="form-group">
            <label for="genderSection">القسم:</label>
            <select id="genderSection" name="genderSection" required>
                <option value="">اختر القسم</option>
                <option value="بنين">بنين</option>
                <option value="بنات">بنات</option>
            </select>
        </div>

        <!-- المرحلة الدراسية -->
        <div class="form-group">
            <label for="academicStage">المرحلة الدراسية:</label>
            <select id="academicStage" name="academicStage" required>
                <option value="">اختر المرحلة</option>
                <option value="الابتدائية">الابتدائية</option>
                <option value="المتوسطة">المتوسطة</option>
                <option value="الثانوية">الثانوية</option>
            </select>
        </div>

        <!-- أزرار العمليات المطلوبة -->
        <div class="btn-group">
            <button type="button" class="btn-add" onclick="sendData('ADD')">إضافة طالب</button>
            <button type="button" class="btn-update" onclick="sendData('UPDATE')">تعديل بيانات</button>
            <button type="button" class="btn-delete" onclick="sendData('DELETE')">حذف طالب</button>
        </div>
    </form>

    <div id="response-message"></div>
</div>

<script>
    // روابط الـ Webhook المخصصة لكل من GET و POST
    const WEBHOOK_GET_URL = 'http://localhost:5678/webhook-test/2dbf7f81-f2bf-4dcd-8c34-ad4f6bc012dc';
    const WEBHOOK_POST_URL = 'http://localhost:5678/webhook-test/2dbf7f81-f2bf-4dcd-8c34-ad4f6bc012dc';

    // 2. البحث (GET)
async function searchStudent(type) {
    const data = getFormData();
    const url = new URL(N8N_WEBHOOK_URL);
    
    if (type === 'id') {
        if(!data.nationalId) return showMessage("أدخل رقم الهوية للبحث", false);
        url.searchParams.append('action', 'searchID');
        url.searchParams.append('nationalId', data.nationalId);
    } else {
        if(!data.studentName) return showMessage("أدخل اسم الطالب للبحث", false);
        url.searchParams.append('action', 'searchName');
        url.searchParams.append('studentName', data.studentName);
    }

    try {
        const response = await fetch(url.toString(), { method: 'GET' });
        let result = await response.json(); 
        
        // --- التعديل الجديد: التحقق مما إذا كانت النتيجة مصفوفة (Array) ---
        if (Array.isArray(result) && result.length > 0) {
            result = result[0]; // أخذ أول نتيجة فقط
        }
        // -----------------------------------------------------------------

        if(result && result.studentName) {
            document.getElementById('studentName').value = result.studentName;
            document.getElementById('nationalId').value = result.nationalId;
            document.getElementById('section').value = result.section;
            document.getElementById('stage').value = result.stage;
            
            stageSelect.dispatchEvent(new Event('change'));
            document.getElementById('grade').value = result.grade;
            document.getElementById('classNumber').value = result.classNumber || '1';
            document.getElementById('track').value = result.track || 'عام';

            updateFullClassName();
            showMessage("تم العثور على بيانات الطالب", true);
            toggleActionButtons(true);
        } else {
            showMessage("لم يتم العثور على الطالب", false);
            toggleActionButtons(false);
        }
    } catch (error) {
        console.error(error);
        showMessage("حدث خطأ أثناء البحث، تأكد من إعدادات n8n", false);
    }
}

    // دالة إرسال طلبات الإضافة، التعديل، والحذف إلى n8n Webhook (POST)
    async function sendData(actionType) {
        const nationalId = document.getElementById('nationalId').value.trim();
        const studentName = document.getElementById('studentName').value.trim();
        const genderSection = document.getElementById('genderSection').value;
        const academicStage = document.getElementById('academicStage').value;

        if (!nationalId) {
            showMsg('رقم الهوية حقل إجباري', 'error');
            return;
        }

        if ((actionType === 'ADD' || actionType === 'UPDATE') && (!studentName || !genderSection || !academicStage)) {
            showMsg('الرجاء تعبئة جميع الحقول المطلوبة', 'error');
            return;
        }

        const payload = {
            action: actionType, // 'ADD', 'UPDATE', 'DELETE'
            data: {
                nationalId,
                studentName,
                genderSection,
                academicStage
            }
        };

        try {
            const response = await fetch(WEBHOOK_POST_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                showMsg(result.message || 'تمت العملية بنجاح!', 'success');
                if (actionType === 'ADD' || actionType === 'DELETE') {
                    document.getElementById('studentForm').reset();
                }
            } else {
                showMsg(result.message || 'حدث خطأ أثناء تنفيذ الطلب', 'error');
            }
        } catch (error) {
            console.error(error);
            showMsg('تعذر الاتصال بـ Webhook الخاص بـ n8n', 'error');
        }
    }

    function showMsg(text, type) {
        const msgDiv = document.getElementById('response-message');
        msgDiv.textContent = text;
        msgDiv.className = type;
        msgDiv.style.display = 'block';
        setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 4000);
    }
</script>
