<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الطلاب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>تسجيل طالب جديد</h2>
    <form id="studentForm">
        <div class="form-group">
            <label for="studentName">اسم الطالب:</label>
            <input type="text" id="studentName" name="studentName" required>
        </div>
        
        <div class="form-group">
            <label for="studentStage">المرحلة الدراسية:</label>
            <select id="studentStage" name="studentStage" required>
                <option value="الابتدائية">المرحلة الابتدائية</option>
                <option value="المتوسطة">المرحلة المتوسطة</option>
                <option value="الثانوية">المرحلة الثانوية</option>
            </select>
        </div>

        <button type="submit">تسجيل البيانات</button>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('studentForm').addEventListener('submit', function(e) {
        e.preventDefault(); // منع إعادة تحميل الصفحة

        // جمع البيانات من النموذج
        const formData = {
            name: document.getElementById('studentName').value,
            stage: document.getElementById('studentStage').value,
            date: new Date().toLocaleDateString('ar-SA')
        };

        // رابط Webhook الخاص بـ n8n (قم باستبداله بالرابط الخاص بك)
        const webhookUrl = 'YOUR_N8N_WEBHOOK_URL_HERE';

        // إرسال البيانات عبر POST Request
        fetch(webhookUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(response => {
            if(response.ok) {
                document.getElementById('message').style.color = 'green';
                document.getElementById('message').innerText = 'تم التسجيل بنجاح!';
                document.getElementById('studentForm').reset(); // تفريغ الحقول
            } else {
                throw new Error('حدث خطأ في التسجيل');
            }
        })
        .catch(error => {
            document.getElementById('message').style.color = 'red';
            document.getElementById('message').innerText = 'فشل الاتصال بالخادم. حاول مرة أخرى.';
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
